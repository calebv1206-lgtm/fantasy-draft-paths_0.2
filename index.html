<!DOCTYPE html>
<html>
<head>
<style>

body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    color: white;
    min-height: 100vh;
    position: relative;

    background:
        linear-gradient(
            rgba(0,0,0,.70),
            rgba(0,0,0,.70)
        ),
        url("image field.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}


/* Comic-book dot texture */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    opacity: 0.025;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.4) 1px,
            transparent 1px
        );

    background-size: 32px 32px;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.subtitle {
    text-align: center;
    color: #cccccc;
    margin-bottom: 25px;
}

/* Current Picks box */
#history {
    background:
        linear-gradient(
            180deg,
            #214021,
            #152915
        );

    color: white;

    padding: 15px;

    border-radius: 12px;

    border: 1px solid #3f7f3f;

    box-shadow:
        0 4px 15px rgba(0,0,0,.4);

    margin-bottom: 20px;
}

/* Draft buttons */
button {
    width: 100%;
    padding: 16px;
    margin: 10px 0;

    color: white;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: .5px;

    border-radius: 14px;
    border: 1px solid #67c267;

    cursor: pointer;

    background:
        linear-gradient(
            180deg,
            #4caf50 0%,
            #2e7d32 50%,
            #1b5e20 100%
        );

    box-shadow:
        0 6px 14px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.20);

    transition: all .15s ease;
}

button:hover {
    transform: translateY(-3px);

    background:
        linear-gradient(
            180deg,
            #5fd564 0%,
            #3d9641 50%,
            #256c28 100%
        );

    box-shadow:
        0 10px 20px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.30);
}

button:active {
    transform: translateY(1px);

    box-shadow:
        0 3px 8px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.15);
}

#pick-popup {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 64px;
    font-weight: bold;

    opacity: 0;
    visibility: hidden;

    transition: opacity .4s ease;

    z-index: 9999;

    text-align: center;
    padding: 20px;
}

h3 {
    text-align: center;
    color: white;
}

hr {
    border: none;
    border-top: 1px solid #2a2a2a;
    margin: 20px 0;
}

</style>

    <meta charset="UTF-8">
    <title>Fantasy Draft Assistant</title>
</head>

<body>

<h1>🏈 Fantasy Draft Assistant</h1>

<div class="subtitle">
Personal Draft Planner
</div>

<div class="subtitle">
Draft Path Planner
</div>

<div id="history">
Current Picks:
</div>

<div id="options">
</div>

<div id="pick-popup"></div>

<script>

const PATHS_URL = "./draftpaths.csv";
const PLAYERS_URL = "./players.csv";

let data = {};
let players = {};

const optionsDiv = document.getElementById("options");
const historyDiv = document.getElementById("history");

let picks = [];

Promise.all([
    fetch(PATHS_URL).then(r => r.text()),
    fetch(PLAYERS_URL).then(r => r.text())
])
.then(([pathsCsv, playersCsv]) => {

    pathsCsv
        .trim()
        .split("\n")
        .slice(1)
        .forEach(row => {

            const cols = row.split("\t");

            const key = cols[0].trim();

            const options = cols
                .slice(1)
                .map(x => x.trim())
                .filter(x => x);

            data[key] = options;
        });

    playersCsv
    .trim()
    .split("\n")
    .slice(1)
    .forEach(row => {

        const cols = row.split(",");

        if (cols.length < 2) return;

        players[cols[0].trim()] =
            cols[1].trim();
    });
    
console.log(players);
console.log(players["A01"]);
console.log(data);
console.log(data["START"]);
    
    showOptions("START");
});

function playerName(id) {
    return players[id] || id;
}
function showPickPopup(name) {

    const popup =
        document.getElementById("pick-popup");

    popup.textContent = name;

    popup.style.visibility = "visible";
    popup.style.opacity = "1";

    setTimeout(() => {
        popup.style.opacity = "0";

        setTimeout(() => {
            popup.style.visibility = "hidden";
        }, 400);

    }, 1500);
}
function showOptions(key) {

    optionsDiv.innerHTML = "";

    const options = data[key];

    if (!options || options.length === 0) {
        optionsDiv.innerHTML = "<h3>You Got It From Here</h3>";
        return;
    }

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.textContent = playerName(option);

       btn.onclick = () => {

    const selectedPlayer =
        playerName(option);

    showPickPopup(selectedPlayer);

    picks.push(selectedPlayer);

    historyDiv.innerHTML =
        "Current Picks:<br>" +
        picks.join(" → ");

    showOptions(option);
};

        optionsDiv.appendChild(btn);
    });
}

</script>
    
</body>
</html>
